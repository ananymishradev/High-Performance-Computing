#!/usr/bin/env bash
# ============================================================
#  cluster.conf - single source of truth for the HPC cluster
#
#  Topology:  1 host (WSL machine, am_user@SRMS1) as SLURM
#             controller + NFS server, N Ubuntu workers as
#             SLURM compute nodes + NFS clients.
#
#  YOU enter IPs manually. Either edit this file directly, or
#  just run ./setup_host.sh and it will prompt you for every
#  IP and save your answers back into this file.
#
#  Workers need ONLY openssh-server installed. Everything else
#  (users, packages, munge, slurm, NFS, firewall) is set up by
#  the scripts.
# ============================================================

# --- Cluster identity ---------------------------------------
# Identical username on EVERY node. Defaults to the WSL user.
# The scripts create this user on workers with the SAME
# UID/GID as on the host (required for NFS + SLURM).
CLUSTER_USER="am_user"

# SLURM ClusterName shown in sinfo/squeue.
CLUSTER_NAME="paanduv"

# --- Host (controller + NFS server, WSL machine) ------------
# Hostname as seen by `hostname` inside WSL (often uppercase).
HOST_HOSTNAME="SRMS1"
# LAN IP the WORKERS must use to reach the host.
#   * Native Ubuntu host:  the host's own LAN IP (hostname -I).
#   * WSL2 mirrored networking: same - WSL shares Windows IP.
#   * WSL2 NAT (default): the WINDOWS Ethernet/Wi-Fi IP
#     (run `ipconfig` on Windows), NOT the 172.x WSL-internal IP.
#     You must port-forward (the setup script generates the .ps1).
HOST_IP="192.168.1.100"

# WSL2-internal IP (e.g. 172.21.x.x from `hostname -I` in WSL).
# Only used for diagnostics + port-forward target. Leave empty
# to auto-detect; setup_host.sh fills it in.
WSL_IP=""

# Set to "yes" if WSL uses mirrored networking
# (%USERPROFILE%\.wslconfig contains networkingMode=mirrored).
# "no"  = classic NAT -> workers use HOST_IP (Windows IP) and you
#         must run the generated port-forward script on Windows.
# "auto" = ask at setup time (recommended).
WSL_MIRRORED="auto"

# --- Workers (Ubuntu machines, ssh-only fresh install) ------
# "hostname:lan-ip" entries separated by spaces.
# EXAMPLE with 2 workers - edit to match your lab:
WORKERS="worker1:192.168.1.101 worker2:192.168.1.102"

# Initial SSH login on each worker BEFORE the cluster user exists.
# This is the user you created during Ubuntu install (often the
# same name, or "ubuntu"). The script logs in as this user ONCE
# to create $CLUSTER_USER, then never uses it again.
# If every worker uses the same initial user, set it here.
# Use "ask" to be prompted per worker (safest).
WORKER_INIT_USER="ask"

# --- Shared storage ("shared memory" for jobs) --------------
# One directory, identical path on every node, backed by NFS
# served from the host. Put job scripts, data, results here -
# SLURM jobs MUST use paths visible on all nodes.
SHARED_DIR="/mnt/hpc-shared"

# Subnet allowed to mount NFS (must cover host + all workers).
# /24 = first 3 octets fixed, e.g. 192.168.1.0/24.
NFS_ALLOWED_SUBNET="192.168.1.0/24"

# --- Shared POSIX memory (/dev/shm) -------------------------
# MPI + many HPC codes use /dev/shm. Default on Ubuntu is 50%
# of RAM, which is fine. Set to e.g. "8g" or "50%" to enforce
# a size on every node, or "auto" to leave the default.
SHM_SIZE="auto"
