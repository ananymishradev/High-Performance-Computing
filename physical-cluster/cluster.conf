#!/usr/bin/env bash
# ============================================================
#  cluster.conf - single source of truth for the SLURM cluster
#
#  Edit the values below to match YOUR machines, then run on
#  the control node:
#      ./setup_host.sh
#  A single worker can be set up by hand with:
#      WORKER_NAME=worker1 ./setup_worker.sh
# ============================================================

# Identical username with sudo rights on EVERY machine.
CLUSTER_USER="anany"

# Control node (host)
HOST_HOSTNAME="host"
HOST_IP="192.168.1.100"

# Compute nodes: "hostname:lan-ip" entries separated by spaces.
# Add or remove entries to match your LAN address plan.
WORKERS="worker1:192.168.1.101 worker2:192.168.1.102 worker3:192.168.1.103"

# Cluster name shown in sinfo/squeue output.
CLUSTER_NAME="paanduv"